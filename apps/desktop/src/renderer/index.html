<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation.AI Desktop</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --brand: #6366f1;
      --brand-hover: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* Toolbar */
    .toolbar {
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .toolbar button, .toolbar select {
      -webkit-app-region: no-drag;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--brand), #4338ca);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #334155;
    }
    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
    .btn-primary:hover {
      background: var(--brand-hover);
    }
    select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    /* Main container */
    .container {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .editor-pane {
      width: 45%;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    textarea {
      flex: 1;
      background: transparent;
      color: var(--text);
      border: none;
      padding: 16px;
      font-family: "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    .preview-pane {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Empty state */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg);
      z-index: 10;
    }
    .file-path {
      font-size: 11px;
      color: var(--text-muted);
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8" /><path d="M12 17v4" />
        </svg>
      </div>
      <span>Presentation.AI Desktop</span>
      <span id="filePathLabel" class="file-path"></span>
    </div>

    <div class="actions">
      <select id="themeSelect">
        <option value="nord">Nord</option>
        <option value="midnight">Midnight</option>
        <option value="paper">Paper</option>
        <option value="neon">Neon</option>
        <option value="sunset">Sunset</option>
        <option value="forest">Forest</option>
      </select>

      <button id="openBtn" class="btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        Open File
      </button>

      <button id="saveBtn" class="btn">Save</button>
      <button id="pdfBtn" class="btn">Export PDF</button>
      <button id="presentBtn" class="btn btn-primary">Present</button>
    </div>
  </div>

  <div class="container">
    <div class="editor-pane">
      <textarea id="editor" placeholder="Write your markdown slides here...
---
## Slide 2
Add content..."></textarea>
    </div>

    <div class="preview-pane">
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
